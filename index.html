<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فيسكا كار | وكالة كراء السيارات بالرباط</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Cairo', sans-serif; background-color: #0b0f17; color: #f1f5f9; } </style>
</head>
<body class="bg-[#0b0f17] text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-[#0b0f17]/90 border-b border-slate-800 p-4 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <h1 class="text-xl font-bold text-white">فيسكا كار (Fiska Car)</h1>
      <a href="https://wa.me/212622177043" target="_blank" class="bg-green-500 text-black font-bold px-4 py-2 rounded-xl text-sm">حجز واتساب</a>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="py-12 px-4 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
    <div class="lg:col-span-7 space-y-4">
      <h2 class="text-3xl font-extrabold text-white">كراء السيارات بالرباط وسلا بأفضل الأسعار</h2>
      <p class="text-slate-300">استمتع برحلتك مع سيارات حديثة ومضمونة ابتداءً من 249 درهم.</p>
    </div>
    <div class="lg:col-span-5">
      <div class="bg-slate-900 border border-slate-800 p-2 rounded-xl">
        <img src="assets/aistudio/IMG-20261109-WA0009_47eb7a2a.jpg" alt="Poster" class="w-full h-auto rounded-lg object-cover">
      </div>
    </div>
  </section>

  <!-- Fleet Section -->
  <section class="py-12 px-4 max-w-7xl mx-auto" id="fleet">
    <h3 class="text-2xl font-bold text-white mb-6">السيارات المتوفرة</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Car 1 -->
      <div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden p-4">
        <img src="assets/aistudio/IMG-20261109-MA0011_932ffd76.jpg" alt="Dacia Logan" class="w-full h-48 object-cover rounded-lg mb-4">
        <h4 class="text-xl font-bold text-white">داسيا لوجان (Dacia Logan)</h4>
        <p class="text-amber-400 font-bold mt-2">249 درهم / اليوم</p>
      </div>

      <!-- Car 2 -->
      <div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden p-4">
        <img src="assets/aistudio/IMG-20261109-WA0010_e62db03e.jpg" alt="Dacia Duster" class="w-full h-48 object-cover rounded-lg mb-4">
        <h4 class="text-xl font-bold text-white">داسيا داستر (Dacia Duster)</h4>
        <p class="text-amber-400 font-bold mt-2">399 درهم / اليوم</p>
      </div>

    </div>
  </section>

</body>
</html>
